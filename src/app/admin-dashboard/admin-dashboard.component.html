<div class="d-flex flex-row mb-3">

    <!-- Colonne gauche : cartes -->
    <div class="p-2">
      <div *ngFor="let input of puccaInputs; let i = index" class="mb-3">
  
        <!-- Carte -->
        <div class="card border-0"
             [ngStyle]="{'background-color': input.backgroundColor, 'color': input.fontColor}">
  
          <!-- Header -->
          <div class="card-header d-flex justify-content-between align-items-center border-0">
            <span class="fw-bold">{{ input.sentences[0] }}</span>
  
            <button class="btn btn-sm btn-outline-light"
                    type="button"
                    data-bs-toggle="collapse"
                    [attr.data-bs-target]="'#collapseCard' + i"
                    aria-expanded="false"
                    [attr.aria-controls]="'collapseCard' + i">
              <i class="bi bi-chevron-down"></i>
            </button>
          </div>
  
          <!-- Contenu collapse -->
          <div [id]="'collapseCard' + i" class="collapse">
            <div class="p-3 d-flex flex-wrap gap-3">
  
              <!-- Liste des phrases -->
              <div class="flex-fill">
                <div *ngFor="let sentence of input.sentences; let j = index" class="d-flex align-items-center gap-2 mb-2">
                  <input type="text" [(ngModel)]="input.sentences[j]" class="form-control" />
                  <button class="btn btn-outline-danger btn-sm" (click)="removeSentence(input, j)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
                <button class="btn btn-outline-success btn-sm" (click)="addSentence(input)">
                  <i class="bi bi-plus"></i> Ajouter une phrase
                </button>
              </div>
  
              <!-- Panneau droit -->
              <div class="d-flex flex-column gap-3" style="min-width: 200px;">
  
                <!-- Heures -->
                <div>
                  <i class="bi bi-clock"></i> {{ input.heures.join(', ') }}
                </div>
  
                <!-- Couleur texte -->
                <div class="d-flex align-items-center gap-2">
                  <i class="bi bi-eyedropper"></i>
                  Couleur texte : {{ input.fontColor }}
                  <button class="btn btn-sm"
                          [ngStyle]="{'background-color': input.fontColor, 'border': '1px solid #ccc'}"
                          (click)="toggleFontColor(input)">
                  </button>
                </div>
  
                <!-- Color picker HEX -->
                <div class="d-flex align-items-center gap-2">
                  <i class="bi bi-pencil"></i>
                  <input type="color"
                         [(ngModel)]="input.backgroundColor"
                         class="form-control form-control-color p-0"
                         title="Changer la couleur de fond" />
                  <span>{{ input.backgroundColor }}</span>
                </div>
  
                <!-- Bouton valider -->
                <button class="btn btn-primary" (click)="validateChanges(input)">
                  <i class="bi bi-check-lg"></i> Valider
                </button>
  
              </div>
            </div>
          </div>
  
        </div>
      </div>
  
      <!-- Bouton + pour créer un nouveau pucca input -->
      <button class="btn btn-success mt-3" data-bs-toggle="modal" data-bs-target="#newPuccaModal">
        <i class="bi bi-plus-lg"></i> Nouveau Pucca Input
      </button>
    </div>
  
    <!-- Colonne droite -->
    <div class="p-2">MSG TO DEV</div>
    <div class="p-2">CONNECTIONS</div>
  </div>
  
  <!-- Modal création -->
  <div class="modal fade" id="newPuccaModal" tabindex="-1" aria-labelledby="newPuccaLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content" style="background-color: {{newPucca.backgroundColor}}; color: {{newPucca.fontColor}}">
  
        <div class="modal-header">
          <h5 class="modal-title" id="newPuccaLabel">Nouveau Pucca Input</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
  
        <div class="modal-body">
          <div class="mb-3">
            <label>Couleur fond</label>
            <input type="color" [(ngModel)]="newPucca.backgroundColor" class="form-control form-control-color" />
          </div>
          <div class="mb-3">
            <label>Couleur texte</label>
            <select [(ngModel)]="newPucca.fontColor" class="form-select">
              <option value="white">White</option>
              <option value="black">Black</option>
            </select>
          </div>
          <div class="mb-3">
            <label>Heures</label>
            <input type="text" [(ngModel)]="newPucca.heures" class="form-control" placeholder="ex: 22, 23, 0" />
          </div>
          <div class="mb-3">
            <label>Phrases</label>
            <div *ngFor="let s of newPucca.sentences; let k = index" class="d-flex gap-2 mb-2">
              <input type="text" [(ngModel)]="newPucca.sentences[k]" class="form-control" />
              <button class="btn btn-outline-danger btn-sm" (click)="removeSentence(newPucca, k)">
                <i class="bi bi-trash"></i>
              </button>
            </div>
            <button class="btn btn-outline-success btn-sm" (click)="addSentence(newPucca)">
              <i class="bi bi-plus"></i> Ajouter une phrase
            </button>
          </div>
        </div>
  
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button class="btn btn-primary" (click)="createPucca()">Créer</button>
        </div>
  
      </div>
    </div>
  </div>
